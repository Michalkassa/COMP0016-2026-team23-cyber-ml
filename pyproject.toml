[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberml"
version = "0.0.1"
description = "COMP0016 Team 23: Generative Data Science for Cybersecurity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyter>=1.0"]
# Tabular foundation model; check the weights licence before use (see docs/06-governance/ip-licensing.md).
tabpfn = ["tabpfn"]

[tool.hatch.build.targets.wheel]
packages = ["src/cyberml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
