[project]
name = "cyberml"
version = "0.0.1"
description = "COMP0016 Team 23: Generative Data Science for Cybersecurity"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyter>=1.0"]
# Check the TabPFN weights licence before use.
tabpfn = ["tabpfn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
